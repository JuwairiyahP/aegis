apiVersion: v1
kind: Namespace
metadata: {name: aegis}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: demo, namespace: aegis, labels: {app: demo}}
spec:
  selector: {matchLabels: {app: demo}}
  template:
    metadata: {labels: {app: demo}}
    spec:
      containers:
      - name: demo
        image: aegis-demo:v2
        imagePullPolicy: IfNotPresent
        ports: [{name: http, containerPort: 8000}]
        env:
        - {name: STARTUP_DELAY, value: "30"}
        - {name: WORK_ITERS, value: "20000"}
        resources:
          requests: {cpu: 250m, memory: 128Mi}
          limits:   {cpu: 250m, memory: 256Mi}
        readinessProbe:
          httpGet: {path: /readyz, port: http}
          periodSeconds: 2
          timeoutSeconds: 3
          failureThreshold: 5
---
apiVersion: v1
kind: Service
metadata: {name: demo, namespace: aegis, labels: {app: demo}}
spec:
  selector: {app: demo}
  ports: [{name: http, port: 80, targetPort: http}]
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata: {name: demo, namespace: aegis}
spec:
  rules:
  - http:
      paths:
      - {path: /, pathType: Prefix, backend: {service: {name: demo, port: {number: 80}}}}
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata: {name: demo, namespace: aegis}
spec:
  selector: {matchLabels: {app: demo}}
  endpoints: [{port: http, path: /metrics, interval: 5s}]
