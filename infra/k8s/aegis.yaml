apiVersion: apps/v1
kind: Deployment
metadata: {name: predictor, namespace: aegis, labels: {app: predictor}}
spec:
  replicas: 1
  selector: {matchLabels: {app: predictor}}
  template:
    metadata: {labels: {app: predictor}}
    spec:
      containers:
      - name: predictor
        image: aegis-predictor:v3
        imagePullPolicy: IfNotPresent
        ports: [{name: http, containerPort: 8000}]
        env: [{name: PROM_URL, value: "http://mon-kube-prometheus-stack-prometheus.monitoring.svc:9090"}]
        resources: {requests: {cpu: 100m, memory: 256Mi}, limits: {cpu: 500m, memory: 512Mi}}
        readinessProbe: {httpGet: {path: /healthz, port: http}}
---
apiVersion: v1
kind: Service
metadata: {name: predictor, namespace: aegis, labels: {app: predictor}}
spec:
  selector: {app: predictor}
  ports: [{name: http, port: 80, targetPort: http}]
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata: {name: predictor, namespace: aegis}
spec:
  selector: {matchLabels: {app: predictor}}
  endpoints: [{port: http, path: /metrics, interval: 5s}]
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: policy, namespace: aegis}
spec:
  replicas: 0          # 0 = baseline (HPA only), 1 = AEGIS
  selector: {matchLabels: {app: policy}}
  template:
    metadata: {labels: {app: policy}}
    spec:
      serviceAccountName: aegis-policy
      containers:
      - name: policy
        image: aegis-policy:v1
        imagePullPolicy: IfNotPresent
        env:
        - {name: RISK_URL, value: "http://predictor.aegis.svc/risk"}
        - {name: TAU, value: "auto"}
        - {name: COOLDOWN, value: "60"}
        - {name: BOOST_TTL, value: "180"}
        - {name: POLL_SECONDS, value: "10"}
        resources: {requests: {cpu: 50m, memory: 128Mi}, limits: {cpu: 200m, memory: 256Mi}}
