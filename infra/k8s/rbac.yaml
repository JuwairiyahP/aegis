apiVersion: v1
kind: ServiceAccount
metadata: {name: aegis-policy, namespace: aegis}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata: {name: hpa-patcher, namespace: aegis}
rules:
- apiGroups: ["autoscaling"]
  resources: ["horizontalpodautoscalers"]
  verbs: ["get", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: {name: aegis-policy-hpa, namespace: aegis}
subjects: [{kind: ServiceAccount, name: aegis-policy, namespace: aegis}]
roleRef: {kind: Role, name: hpa-patcher, apiGroup: rbac.authorization.k8s.io}
